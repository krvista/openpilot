name: i6nv3 phase tests

on:
  push:
    branches: [i6nv3]
  pull_request:
    branches: [i6nv3]

jobs:
  phase-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (pure-python paths only, no scons)
        run: pip install numpy pycapnp pycryptodome zstandard tqdm requests pyzmq setproctitle sentry-sdk pyjwt cryptography pytest ruff
      - name: ruff (fork-owned dirs)
        run: ruff check --select F --ignore F841 phase_tests tools/i6nv3_bench
      - name: phase tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/opendbc_repo
        run: python -m pytest phase_tests -q -p no:cacheprovider
